# Multi-page static site — no SPA redirect
# Netlify will serve index.html, about.html, services.html, products.html, contact.html directly

[build]
  publish = "."

# Optional: pretty 404 handling (uncomment if you add a 404.html later)
# [[redirects]]
#   from = "/*"
#   to = "/404.html"
#   status = 404


# Baseline response protections for the static public site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Resource-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-DNS-Prefetch-Control = "off"
    Cross-Origin-Opener-Policy = "same-origin"
