name: Static site navigation tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check main.js
      - name: Run navigation regression tests
        run: node --test tests/*.test.js
